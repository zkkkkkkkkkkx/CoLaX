base:
  root_dir: ./
dataset:
  name: atrialfibrillation
  meta_dataset: uea

multi:
  dataset: AtrialFibrillation   # UEA native multivariate dataset
  num_classes: 3                 # n / s / t (3 classes)
  seq_len: 640
  proto_len: 200                 # ~31% of seq_len
  num_prototypes_local: 2
  num_prototypes_global: 2
  d_model: 32
  patch_len: 8
  stride: 2
  e_layers_local: 2
  e_layers_global: 1
  batch_size: 8
  shapley_permutations: 30
  fuse_method: hybrid
  fuse_alpha: 0.5
  perturbation_num_steps: 20
