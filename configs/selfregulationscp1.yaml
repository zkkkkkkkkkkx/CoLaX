base:
  root_dir: ./
dataset:
  name: selfregulationscp1
  meta_dataset: uea

multi:
  dataset: SelfRegulationSCP1   # UEA native multivariate dataset
  num_classes: 2                 # negativity / positivity (binary)
  seq_len: 896
  proto_len: 280                 # ~31% of seq_len
  num_prototypes_local: 2
  num_prototypes_global: 2
  d_model: 32
  patch_len: 8
  stride: 2
  e_layers_local: 2
  e_layers_global: 1
  batch_size: 4                  # smaller batch for long sequences
  shapley_permutations: 30
  fuse_method: hybrid
  fuse_alpha: 0.5
  perturbation_num_steps: 20
